# Frozen n=5 quadrant experiment config (SPEC Phase 2).
# After Phase 3 starts, any change invalidates all prior runs (SPEC §1.6).
# SHA-256 of this file is recorded on every result JSON.

experiment: quadrant_n5
reuse_transforms: false
latency_budget_ms: 50

session:
  session_s: 600
  arena_shape: square
  arena_size_cm: 100.0
  thigmotaxis: 0.8
  behavior_dt: 0.050
  sample_rate_hz: 30000

# Read-only lab probe track. Do not edit this file; hash is recorded on every result.
probe_track:
  file: configs/trajectories/lab_npx2_default.yaml
  regions_file: configs/trajectories/lab_npx2_default_regions.csv
  cell_capture_file: configs/trajectories/lab_npx2_default_cell_capture.yaml
  role: lab_insertion_readonly

# Explicit scientific change: include hippocampal_formation_transition.
# Default pipeline still drops unrecognised region labels.
unit_inclusion:
  mode: explicit_region_list
  regions:
    - entorhinal_transition
    - hippocampal_formation_transition
    - entorhinal_cortex_layer6a
    - entorhinal_cortex_layer5
    - medial_entorhinal_layer3
    - medial_entorhinal_layer2
    - medial_entorhinal_layer1
  require_allowed_cell_type: true
  exclude_visual_cortex: true

seeds:
  n_seeds: 5
  master_seed: 20260923
  # Per data seed i: SeedSequence(master_seed).spawn(n_seeds)[i]
  # then spawn components in this order.
  components:
    - trajectory
    - neural
    - recording_noise
    - sorting_errors
    - methods

spike_sources:
  - key: sorted
    spec_alias: sorted
    role: primary
    deployable: true
    notes: Degraded + simulated sorting. Only source allowed in deployable or realtime claims.
  - key: ground_truth
    spec_alias: gt
    role: reference
    deployable: false
    notes: Simulator ground-truth spikes. Labelled non-deployable everywhere it appears.

features:
  window_s: 0.250
  update_dt: 0.050
  window: "[t-W, t)"
  label_time: right_edge
  feature_set: counts
  transform: sqrt_then_zscore
  zscore_fit: train_only

split:
  # Explicit change from the historical 0.70 / no-gap default.
  train_frac: 0.80
  gap_s: 1.0
  gap_rule: max(W + max_history_s, 1.0) rounded up to whole steps
  max_history_s: 0.250
  inner_cv_blocks: 5
  inner_cv_purge: same_gap
  inner_cv_refit_representation: true
  inner_cv_val_path: out_of_sample
  eval_set: intersection_of_valid

representations:
  raw:
    method: identity
    role: control
    quadrant: null
    n_components: null
  raw_lag:
    method: raw_lag
    role: history_control
    quadrant: null
    n_lags: 5
    extra_history_s: 0.250
    n_history_lost: 5
    implemented: true
    notes: Current z-scored counts stacked with the previous 5 causal steps.
  pca:
    method: global_pca
    role: quadrant
    quadrant: linear_static
    svd_solver: auto
    whiten: false
    fit: train_only
    nested: true
  dm:
    method: diffusion_nystrom
    role: quadrant
    quadrant: nonlinear_static
    bandwidth_rule: kth_nn_distance_train_only
    local_scale_k: 10
    alpha: 1.0
    diffusion_time: 1.0
    eps: 1.0e-8
    eigenvalue_min: 1.0e-6
    landmark_cap: 12000
    n_landmarks_if_over_cap: 512
    landmark_method: minibatch_kmeans
    oos: nystrom
    nested: true
  lds:
    method: global_lds
    role: quadrant
    quadrant: linear_dynamic
    inference: kalman_filter
    filter_from: session_start
    filter_continuous: true
    smoother_forbidden_on_eval: true
    readout_latents: kalman_filter
    em_iters: 15
    em_tol: null
    init: pca
    process_noise_scale: 0.1
    observation_noise_scale: 1.0
    nested: false
    refit_per_d: true
  isomap:
    method: global_isomap
    role: baseline
    quadrant: null
    n_neighbors: 10
    metric: euclidean
    pre_pca_enabled: true
    pre_pca_n_components: 50
    require_connected_graph: true
    neighbors_algorithm: auto
    path_method: auto
    eigen_solver: auto
    nested: true
  gpfa:
    method: gpfa
    role: baseline
    quadrant: null
    expected_label: offline_only
    kernel: exponential_ar1
    default_tau_s: 0.250
    max_iter: 20
    factor_analysis_max_iter: 500
    nested: false
    refit_per_d: true
  nonlinear_dynamic:
    method: null
    role: empty_cell
    quadrant: nonlinear_dynamic

latent_dims: [2, 3, 5, 10, 20]
nested_fit_d: 20
refit_per_d: [lds, gpfa]
primary_d_rule: lowest_inner_cv_median_error_ridge
primary_d_tie: smaller_d

decoders:
  primary: ridge
  ridge_alphas: logspace
  ridge_alpha_lo: 0.001
  ridge_alpha_hi: 1000.0
  ridge_alpha_n: 13
  sensitivity: knn_regressor
  knn_k: [5, 10, 20, 40]
  knn_weights: uniform
  knn_standardize: true
  knn_standardize_fit: train_only
  target: position_xy_cm

lds_readout:
  audit: A14
  train_latents: kalman_filter
  test_latents: kalman_filter
  same_inference: true
  filter_from: session_start

phase3:
  learning_curve_fracs: [0.25, 0.50, 1.0]
  learning_curve_portion: last_of_train
  learning_curve_source: sorted
  learning_curve_decoder: ridge
  time_shift_s: 300.0
  time_shift_rule: ">= session_s/2"
  floor_baseline: mean_position_train_shifted
  eval_set: intersection_of_valid
  record_versions: [numpy, sklearn]
  a13:
    n_shifts: 20
    shift_frac_lo: 0.25
    shift_frac_hi: 0.75
    floor: same_shifted_labels
    representations: all
    decoders: [ridge, knn]
    fit_representation: once
    refit_per_shift: decoder_only
    pass_rule: median_control_minus_floor_cm
    pass_min_cm: -2.0
  coverage:
    occupancy_n_bins: 10
    metric: fraction_test_in_train_occupied_bins

runtime:
  record_in_every_result_json:
    - numpy
    - sklearn
    - config_sha256
    - git_sha
    - dirty_tree
    - probe_track_sha256
    - n_units
    - n_units_by_cell_type
